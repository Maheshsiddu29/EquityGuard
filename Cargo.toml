[workspace]
resolver = "2"
members = ["programs/equity_guard"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/Maheshsiddu29/EquityGuard"

# Versions are constrained to the set LiteSVM 0.16 resolves against (it pins
# several Solana crates with `~`), so program and test code share one type
# universe for addresses, clocks and instructions.
[workspace.dependencies]
solana-account-info = "3.1"
solana-address = { version = "2.6", features = ["decode"] }
solana-clock = { version = "3.1", features = ["sysvar"] }
solana-get-sysvar = "1"
solana-instructions-sysvar = "4.0"
solana-msg = "3"
solana-program-entrypoint = "3.1"
solana-program-error = "3.0"
# Host builds hash with `sha2`; SBF builds use the sol_sha256 syscall.
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
spl-token-2022-interface = { version = "3.1.1", default-features = false }

base64 = "0.22"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
# The Solana entrypoint macro gates code on the SBF target.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
