name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --lib --locked

  sbf:
    name: SBF build and LiteSVM tests
    runs-on: ubuntu-24.04
    env:
      # Agave release whose cargo-build-sbf/platform-tools the program is
      # validated against. Bump deliberately.
      AGAVE_VERSION: v4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Agave CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build SBF program
        run: cargo build-sbf --manifest-path programs/equity_guard/Cargo.toml -- --locked
      - name: LiteSVM atomicity tests
        run: cargo test --locked -p equity_guard --test litesvm_atomicity

  evidence-script:
    name: Evidence capture script (syntax, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Syntax check
        run: node --check scripts/evidence/capture-equity-mints.mjs
      - name: Test
        run: node --test 'scripts/evidence/*.test.mjs'
