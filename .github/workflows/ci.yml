name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit, golden and deployment-ID tests
        run: cargo test --workspace --lib --test abi_golden --test deployment --locked

  audit:
    name: Rust dependency audit (RustSec)
    runs-on: ubuntu-24.04
    env:
      # Pinned: bump deliberately, never "latest".
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-audit
        # A bare MAJOR.MINOR.PATCH installs exactly that version; --locked
        # uses cargo-audit's own lockfile.
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      # Audits the committed lockfile against the current RustSec database.
      # Any vulnerability fails the job; nothing is ignored. Unmaintained-crate
      # advisories are reported as warnings and do not fail it: today there
      # are five, all reached only through LiteSVM test tooling
      # (docs/m11a-security-review.md, section 7).
      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock

  sbf:
    name: SBF build and LiteSVM tests
    runs-on: ubuntu-24.04
    env:
      # Agave release whose cargo-build-sbf/platform-tools the program is
      # validated against. Bump deliberately.
      AGAVE_VERSION: v4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Agave CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build SBF program
        run: cargo build-sbf --manifest-path programs/equity_guard/Cargo.toml -- --locked
      # Every test target, including the LiteSVM and adversarial suites that
      # need the SBF artifact built above.
      - name: All Rust tests against the SBF artifact
        run: cargo test --workspace --locked

  typescript:
    name: TypeScript and JS (typecheck, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Default depth is 1, which omits the PR base and the previous push
          # SHA. Those commits are required to diff a committed range. This is
          # not a full-history whitespace scan.
          fetch-depth: 0
      - name: Check committed diff for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"
            head="$PUSH_HEAD"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push has no previous commit to diff."
              exit 0
            fi
          else
            echo "No committed range for event $EVENT_NAME."
            exit 0
          fi
          for sha in "$base" "$head"; do
            case "$sha" in
              *[!0-9a-f]* | "")
                echo "Refusing to diff a non-SHA ref."
                exit 1
                ;;
            esac
          done
          git diff --check "$base" "$head"
      - uses: actions/setup-node@v4
        with:
          # Type stripping (running .ts directly) is enabled by default from 22.18.
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Evidence script syntax
        run: node --check scripts/evidence/capture-equity-mints.mjs
      - name: Test
        run: npm test

  web:
    name: Web (apps/web lint, typecheck, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
