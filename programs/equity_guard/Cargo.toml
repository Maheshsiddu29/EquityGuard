[package]
name = "equity_guard"
version = "0.1.0"
description = "Execution-time corporate-action guard for Token-2022 tokenized equities"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Recognised by `solana_program_entrypoint::entrypoint!`; declared so the
# macro's cfg gates are known to the compiler.
custom-heap = []
custom-panic = []

[dependencies]
solana-account-info.workspace = true
# `curve25519` provides `find_program_address` for canonical ATA checks: the
# SBF build uses the syscall; only host builds link curve25519-dalek.
solana-address = { workspace = true, features = ["curve25519"] }
solana-clock.workspace = true
solana-get-sysvar.workspace = true
solana-instruction.workspace = true
solana-instructions-sysvar.workspace = true
solana-msg.workspace = true
solana-program-entrypoint.workspace = true
solana-program-error.workspace = true
solana-sha256-hasher.workspace = true
spl-token-2022-interface.workspace = true

[dev-dependencies]
base64.workspace = true
# Integration tests reach these through the test crate, not through the lib.
solana-account-info.workspace = true
solana-instructions-sysvar.workspace = true
litesvm = "0.16.0"
serde_json = "1"
solana-account = "4.3"
# Pins the ComputeBudget tags against the derived Borsh encoding.
borsh = "1"
solana-compute-budget-interface = { version = "3.0", features = ["borsh"] }
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-signer = "3"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1"
solana-transaction-error = "3.3"

[lints]
workspace = true
