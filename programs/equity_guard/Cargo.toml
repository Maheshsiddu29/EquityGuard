[package]
name = "equity_guard"
version = "0.1.0"
description = "Execution-time corporate-action guard for Token-2022 tokenized equities"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Recognised by `solana_program_entrypoint::entrypoint!`; declared so the
# macro's cfg gates are known to the compiler.
custom-heap = []
custom-panic = []

[dependencies]
solana-account-info.workspace = true
solana-address.workspace = true
solana-clock.workspace = true
solana-get-sysvar.workspace = true
solana-msg.workspace = true
solana-program-entrypoint.workspace = true
solana-program-error.workspace = true
spl-token-2022-interface.workspace = true

[dev-dependencies]
base64.workspace = true
litesvm = "0.16.0"
solana-account = "4.3"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-signer = "3"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1"
solana-transaction-error = "3.3"

[lints]
workspace = true
